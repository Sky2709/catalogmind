# CI runs the exact same `make` targets a human runs locally (see CLAUDE.md's daily
# commands) - deliberately, not a reimplementation of the same checks in YAML, so
# local dev and CI can never quietly drift apart. Four jobs: a fast one that needs
# no datastores (lint, typecheck, unit tests), a slower one that boots the real
# stack for the integration suite - matching the project's own `make test` vs
# `make test-all` split - an independent, cluster-free Helm chart check
# (`infra/helm/`) that only needs the `helm` binary, not a Python environment - and
# an eval-quality gate that fails the build if search quality regresses.
#
# The quality gate runs against a small, committed fixture catalog
# (`eval/ci_fixture/`), not the real 170-query golden set: that set is anchored to
# real Kaggle catalogs in `data/raw/` which are git-ignored (size/licensing) with
# no scripted CI re-download - see `eval/ci_quality_gate.py`'s module docstring
# for exactly what the fixture can and can't catch, and why that tradeoff was
# made deliberately rather than skipping the gate entirely.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-bge-small-en-v1.5

      - name: Install dependencies
        run: make install

      - name: Lint (ruff check + format)
        run: make lint

      - name: Typecheck (mypy)
        run: make typecheck

      - name: Unit tests (no stack required)
        run: make test

  helm-lint:
    name: Helm chart check (no cluster required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Lint + render the chart
        run: make helm-lint

  integration:
    name: Integration tests (full stack)
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    env:
      # Not "prod" - validate_production() would refuse to boot with the published
      # dev admin token, which is exactly what a CI runner has.
      ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-bge-small-en-v1.5

      - name: Install dependencies
        run: make install

      - name: Start datastores
        run: make up

      - name: Apply database migrations
        run: make migrate

      - name: Full test suite (unit + integration)
        run: make test-all

      - name: Tear down datastores
        if: always()
        run: make down

  eval-quality-gate:
    name: Search quality gate (fixture catalog)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-bge-small-en-v1.5

      - name: Install dependencies
        run: make install

      - name: Start datastores
        run: make up

      - name: Apply database migrations
        run: make migrate

      - name: Run the search quality gate
        run: make eval-gate

      - name: Tear down datastores
        if: always()
        run: make down
