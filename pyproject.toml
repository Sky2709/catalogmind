[project]
name = "catalogmind"
version = "0.1.0"
description = "Multi-tenant conversational commerce API: merchant catalog ingestion, hybrid retrieval, grounded chat."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- web ---
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",
    # --- datastores ---
    "weaviate-client>=4.17,<5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "motor>=3.6",
    "redis>=5.2",
    "arq>=0.26",
    # --- ml / retrieval ---
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "numpy>=1.26,<3",
    # --- llm ---
    # --- ingestion ---
    "pandas>=2.2",
    "python-slugify>=8.0",
    # --- obs ---
    "structlog>=24.4",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "prometheus-client>=0.21",
    "langgraph>=1.2.11",
    "anthropic[bedrock]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "matplotlib>=3.9",
    "rich>=13.9",
]
# Deliberately NOT a core dependency, and deliberately NOT `anthropic`/Bedrock:
# `scripts/enrich_categories.py` is a one-off, offline batch job, and the user
# chose Gemini for it specifically to avoid spending AWS Bedrock quota - a
# scoped, explicit, dated exception to CLAUDE.md's "no Gemini anywhere" rule,
# not a reversal of it. See that script's module docstring and PROGRESS.md.
enrichment = [
    "google-genai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session. The async engine caches a connection pool bound
# to the loop that first used it; with a per-test loop, the second async test inherits a
# pool whose loop has closed and fails with "Event loop is closed".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires the docker compose stack to be running",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
