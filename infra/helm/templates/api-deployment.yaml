{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catalogmind.fullname" . }}-api
  labels:
    {{- include "catalogmind.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "catalogmind.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "catalogmind.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "catalogmind.fullname" . }}-api-config
            - secretRef:
                name: {{ include "catalogmind.fullname" . }}-api-secret
          ports:
            - containerPort: 8000
          # Never touches a dependency - app/routers/health.py:
          # "GET /health" is deliberately dependency-free.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          # Checks Weaviate/Postgres/Mongo/Redis concurrently, 503s if any are
          # down - app/routers/health.py's "GET /health/ready".
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
