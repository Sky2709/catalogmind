{{- if .Values.api.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalogmind.fullname" . }}-api-secret
  labels:
    {{- include "catalogmind.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
data:
  ADMIN_TOKEN: {{ .Values.api.secrets.adminToken | b64enc }}
  AWS_BEARER_TOKEN_BEDROCK: {{ .Values.api.secrets.bedrockApiKey | b64enc }}
  # Built from the in-cluster Postgres service + the same password resolved by
  # catalogmind.postgresPassword (postgres-statefulset.yaml's Secret) - never a
  # second, independently-generated password. Cluster-internal port (5432), not
  # compose's host-remapped 5433 - that remapping only exists to dodge a native
  # Postgres already on the WSL host, which doesn't apply inside a cluster.
  POSTGRES_DSN: {{ printf "postgresql+asyncpg://%s:%s@%s-postgres:5432/%s" .Values.postgres.user (include "catalogmind.postgresPassword" .) (include "catalogmind.fullname" .) .Values.postgres.database | b64enc }}
  MONGO_URI: {{ printf "mongodb://%s-mongo:27017" (include "catalogmind.fullname" .) | b64enc }}
  REDIS_URL: {{ printf "redis://%s-redis:6379/0" (include "catalogmind.fullname" .) | b64enc }}
{{- end }}
