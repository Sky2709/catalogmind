{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "catalogmind.fullname" . }}-api
  labels:
    {{- include "catalogmind.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 8000
  selector:
    {{- include "catalogmind.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
