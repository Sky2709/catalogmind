{{- if and .Values.api.enabled .Values.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "catalogmind.fullname" . }}-api
  labels:
    {{- include "catalogmind.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      {{- include "catalogmind.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
    # Unauthenticated by design, like /health - app/routers/metrics.py.
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
